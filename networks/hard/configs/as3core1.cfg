
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname as3core1
!
boot-start-marker
boot-end-marker
!
!
logging host 1.1.1.1
logging host 2.2.2.2
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
ip tcp synwait-time 5
!
!
interface Loopback0
 ip address 3.10.1.1 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 ip address 3.0.2.2 255.255.255.0
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface GigabitEthernet1/0
 ip address 3.0.1.2 255.255.255.0
 negotiation auto
!
router ospf 1
 network 3.10.1.1 0.0.0.0 area 0
 network 3.0.2.0 0.0.0.255 area 0
 network 3.0.1.0 0.0.0.255 area 0
!
router bgp 65003
 bgp log-neighbor-changes
 network 3.10.1.1 mask 255.255.255.255
 neighbor 10.23.21.3 remote-as 65002
 redistribute ospf 1
!
end
