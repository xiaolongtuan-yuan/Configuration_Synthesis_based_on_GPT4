system {
    host-name leaf1;
    domain-name lab.local;
    services {
        ssh;
        telnet;
        xnm-clear-text;
    }
    syslog {
        user * {
            any emergency;
        }
        file messages {
            any notice;
            authorization info;
        }
        file interactive-commands {
            interactive-commands any;
        }
    }
    login {
        user root {
            authentication {
                encrypted-password ""; ## SECRET-DATA
            }
            uid 0;
            class super-user;
        }
    }
    ntp {
        server 0.pool.ntp.org;
        server 1.pool.ntp.org;
        server 2.pool.ntp.org;
    }
}
interfaces {
    lo0 {
        unit 0 {
            family inet {
                address 2.1.1.2/32;
            }
        }
    }
    ge-0/0/0 {
        unit 0 {
            family inet {
                filter {
                    input RESTRICT_NETWORK_TRAFFIC_IN;
                }
                address 2.34.101.4/24;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                filter {
                    input RESTRICT_NETWORK_TRAFFIC_IN;
                }
                address 2.34.201.4/24;
            }
        }
    }
    ge-0/0/2 {
        unit 0 {
            family inet {
                filter {
                    input RESTRICT_HOST_TRAFFIC_IN;
                    output RESTRICT_HOST_TRAFFIC_OUT;
                }
                address 2.128.0.2/30;
            }
        }
    }
    ge-0/0/3 {
        unit 0 {
            family inet {
                filter {
                    input RESTRICT_HOST_TRAFFIC_IN;
                    output RESTRICT_HOST_TRAFFIC_OUT;
                }
                address 2.128.1.2/30;
            }
        }
    }
}
protocols {
    bgp {
        group as2 {
            type external;
            peer-as 2;
            neighbor 2.34.101.3;
            neighbor 2.34.201.3;
        }
        family inet {
            unicast {
                damping;
            }
        }
        damping {
            half-life 15;
            reuse 750;
            suppress 2000;
            max-suppress-time 60;
        }
        community as2_community members .*:2;
    }
}
policy-options {
    policy-statement as2_to_dept {
        term 1 {
            from community as2_community;
            then {
                local-preference 350;
                next term;
            }
        }
        term 2 {
            then accept;
        }
    }
    policy-statement dept_to_as2 {
        term 1 {
            from {
                route-filter 2.128.0.0/30 exact;
                route-filter 2.128.1.0/30 exact;
            }
            then {
                metric 50;
                community add 65001:2;
                accept;
            }
        }
    }
    community as2_community members _2:;
    as-path-group as2 {
        as-path one ".*2";
    }
}
firewall {
    family inet {
        filter RESTRICT_HOST_TRAFFIC_IN {
            term allow-local-network {
                from {
                    source-address {
                        2.128.0.0/16;
                    }
                }
                then accept;
            }
            term default-deny {
                then {
                    count RESTRICT_HOST_TRAFFIC_IN-deny;
                    discard;
                }
            }
        }
        filter RESTRICT_HOST_TRAFFIC_OUT {
            term allow-http-ssh {
                from {
                    destination-address {
                        2.128.0.0/23;
                    }
                    protocol tcp;
                    port [www ssh];
                }
                then accept;
            }
            term allow-udp {
                from {
                    destination-address {
                        2.128.0.0/16;
                    }
                    protocol udp;
                }
                then accept;
            }
            term default-deny {
                then {
                    count RESTRICT_HOST_TRAFFIC_OUT-deny;
                    discard;
                }
            }
        }
        filter RESTRICT_NETWORK_TRAFFIC_IN {
            term deny-clients {
                from {
                    destination-address {
                        [2.128.0.2/32 2.128.1.2/32];
                    }
                }
                then discard;
            }
            term default-accept {
                then accept;
            }
        }
    }
}