system {
    host-name core1;
    domain-name lab.local;
    services {
        ssh;
        telnet;
        syslog {
            host 1.1.1.1;
            host 2.1.2.2;
            any notice;
        }
    }
    login {
        user root {
            authentication {
                encrypted-password "$ABC123"; ## SECRET-DATA – Replace with the actual root password
            }
            uid 0;
            class super-user;
        }
    }
}

interfaces {
    lo0 {
        unit 0 {
            family inet {
                address 2.1.2.1/32;
            }
        }
    }
    xe-0/0/0 { ## Assumed mapping for GigabitEthernet0/0
        mtu 1514; ## Default MTU size for Ethernet, adjust if necessary
        unit 0 {
            family inet {
                address 2.12.11.2/24;
            }
        }
    }
    xe-0/0/1 { ## Assumed mapping for GigabitEthernet1/0
        mtu 1514;
        unit 0 {
            family inet {
                address 2.12.21.2/24;
            }
        }
    }
    xe-0/0/2 { ## Assumed mapping for GigabitEthernet2/0
        mtu 1514;
        unit 0 {
            family inet {
                address 2.23.11.2/24;
            }
        }
    }
    xe-0/0/3 { ## Assumed mapping for GigabitEthernet3/0
        mtu 1514;
        unit 0 {
            family inet {
                address 2.23.12.2/24;
            }
        }
    }
    ## Add configurations for any other interfaces
}

protocols {
    ospf {
        area 1 {
            interface lo0.0 {
                passive;
            }
            interface xe-0/0/0.0 {
                metric 1;
            }
            interface xe-0/0/1.0 {
                metric 1;
            }
            interface xe-0/0/2.0 {
                metric 1;
            }
            interface xe-0/0/3.0 {
                metric 1;
            }
        }
    }
    bgp {
        group as2-peers {
            type internal;
            local-address 2.1.2.1;
            family inet {
                unicast;
            }
            cluster 2.1.2.1;
            peer-as 2;
            neighbor 2.1.1.1 {
                description "as2 peer-group member";
            }
            neighbor 2.1.1.2 {
                description "as2 peer-group member";
            }
            neighbor 2.1.3.1 {
                description "as2 peer-group member";
            }
            neighbor 2.1.3.2 {
                description "as2 peer-group member";
            }
        }
    }
}

routing-options {
    router-id 2.1.2.1;
    autonomous-system 2;
    static {
        route 2.128.1.1/32 reject;
    }
}

policy-options {
    /* Define BGP policies if needed */
}