system {
    host-name border1;
    domain-name lab.local;
    services {
        ssh;
    }
    ntp {
        server 18.18.18.18;
        server 23.23.23.23;
    }
    authentication-order [ "password" ];
    root-authentication {
        encrypted-password "$ABC123"; ## SECRET-DATA – Insert actual encrypted root password here
    }
}

interfaces {
    lo0 {
        unit 0 {
            family inet {
                address 2.1.1.1/32;
            }
        }
    }
    ge-0/0/0 { ## Assumed mapping for GigabitEthernet0/0
        unit 0 {
            family inet {
                filter {
                    input OUTSIDE_TO_INSIDE;
                    output INSIDE_TO_AS1;
                }
                address 10.12.11.2/24;
            }
        }
    }
    ge-0/0/1 { ## Assumed mapping for GigabitEthernet1/0
        unit 0 {
            family inet {
                address 2.12.11.1/24;
            }
        }
    }
    ge-0/0/2 { ## Assumed mapping for GigabitEthernet2/0
        unit 0 {
            family inet {
                address 2.12.12.1/24;
            }
        }
    }
    ## Add configurations for any other interfaces
}

protocols {
    bgp {
        group as2-peers {
            type internal;
            local-address 2.1.1.1;
            family inet {
                unicast {
                    send-community both;
                    accept-remote-nexthop; # Based on `bgp additional-paths send receive`
                }
            }
            cluster 2.1.1.1;
            neighbor 2.1.2.1;
            neighbor 2.1.2.2;
        }
    }
    ospf {
        area 1 {
            interface lo0.0 {
                passive;
            }
            interface ge-0/0/1.0;
            interface ge-0/0/2.0;
        }
    }
    aggregate {
        route 2.128.0.0/16 policy { };
    }
}

routing-options {
    router-id 2.1.1.1;
    autonomous-system 2;
    static {
        route 2.128.1.255/32 receive;
    }
}

firewall {
    family inet {
        filter INSIDE_TO_AS1 {
            term allow-inside-to-as1 {
                from {
                    source-address {
                        2.0.0.0/8;
                        10.12.11.2/32;
                    }
                    destination-address {
                        1.0.0.0/8;
                        10.12.11.1/32;
                    }
                }
                then accept;
            }
            term deny-all {
                then discard;
            }
        }
        filter OUTSIDE_TO_INSIDE {
            term allow-ssh-to-prefix {
                from {
                    protocol tcp;
                    destination-port ssh;
                    destination-address {
                        2.128.0.0/23;
                    }
                }
                then accept;
            }
            term allow-udp {
                from {
                    protocol udp;
                    destination-address {
                        2.0.0.0/8;
                    }
                }
                then accept;
            }
            term deny-all {
                then discard;
            }
        }
    }
}

policy-options {
    prefix-list inbound_route_filter {
        2.0.0.0/8 longer;
    }
    prefix-list outbound_routes {
        2.128.0.0/9 longer;
    }
    community as1_community members "1:*";
    community as2_community members "2:*";
    community as3_community members "3:*";
    policy-statement TERM-INSIDE-TO-AS1 {
        /* Based on the route map INSIDE_TO_AS1 */
    }
    policy-statement TERM-OUTSIDE-TO-INSIDE {
        /* Based on the route map OUTSIDE_TO_INSIDE */
    }
    policy-statement bgp-export {
        term agg-routes {
            from {
                route-filter 2.128.0.0/16 exact;
            }
            then accept;
        }
    }
}
