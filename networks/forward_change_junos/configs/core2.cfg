system {
    host-name core2;
    domain-name lab.local;
    time-zone UTC;
    root-authentication {
        encrypted-password "$ABC123"; ## SECRET-DATA
    }
    services {
        ssh;
    }
    syslog {
        user * {
            any emergency;
        }
        file messages {
            any any;
            explicit-priority;
        }
        file interactive-commands {
            interactive-commands error;
        }
    }
    ntp {
        server 1.1.1.1;
        server 2.2.2.2;
    }
}

interfaces {
    lo0 {
        unit 0 {
            family inet {
                address 2.1.2.2/32;
            }
        }
    }
    ge-0/0/0 {
        mtu 1800;
        unit 0 {
            family inet {
                address 2.12.22.2/24;
            }
        }
    }
    ge-0/0/1 {
        mtu 1600;
        unit 0 {
            family inet {
                address 2.12.12.2/24;
            }
        }
    }
    ge-0/0/2 {
        mtu 1700;
        unit 0 {
            family inet {
                address 2.23.22.2/24;
            }
        }
    }
    ge-0/0/3 {
        unit 0 {
            family inet {
                address 2.23.21.2/24;
            }
        }
    }
}

routing-options {
    router-id 2.1.2.2;
    static {
        route 2.128.1.1/32 next-hop [2.12.22.2];
    }
}

protocols {
    bgp {
        group as2 {
            type internal;
            local-address 2.1.2.2;
            cluster 2.1.2.2;
            neighbor 2.1.1.1;
            neighbor 2.1.1.2;
            neighbor 2.1.3.1;
            neighbor 2.1.3.2;
            export filter-bogons;
        }
    }
    ospf {
        area 1 {
            interface ge-0/0/0.0 {
                metric 100;
            }
            interface ge-0/0/1.0 {
                metric 100;
            }
            interface ge-0/0/2.0 {
                metric 100;
            }
            interface ge-0/0/3.0 {
                metric 100;
            }
        }
    }
}

policy-options {
    policy-statement filter-bogons {
        term filter {
            from {
                route-filter 0.0.0.0/8 exact;
                route-filter 169.254.0.0/16 exact;
                route-filter 192.0.2.0/24 exact;
                // Additional bogons can be added here
            }
            then reject;
        }
        term allow {
            then accept;
        }
    }
}