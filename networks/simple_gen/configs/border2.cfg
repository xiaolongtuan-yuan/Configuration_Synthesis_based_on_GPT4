!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname border2
!
boot-start-marker
boot-end-marker
!
!
ntp server 18.18.18.18
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 2.1.4.2 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 ip address 10.23.21.2 255.255.255.0
 negotiation auto
!
interface GigabitEthernet1/0
 ip address 2.12.22.1 255.255.255.0
 negotiation auto
!
interface GigabitEthernet2/0
 ip address 2.12.21.1 255.255.255.0
 negotiation auto
!
router ospf 1
 network 2.1.4.2 0.0.0.0 area 0
 network 10.23.21.0 0.0.0.255 area 0
 network 2.12.22.0 0.0.0.255 area 0
 network 2.12.21.0 0.0.0.255 area 0
!
ip route 0.0.0.0 0.0.0.0 2.23.21.2 200
!
end
